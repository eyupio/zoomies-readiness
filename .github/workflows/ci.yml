name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: zoomies-linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Distribution is committed
        run: git diff --exit-code -- dist

  action:
    name: Action smoke test
    runs-on: zoomies-linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: readiness
        uses: ./
      - name: Validate outputs
        env:
          SCORE: ${{ steps.readiness.outputs.score }}
          REPORT: ${{ steps.readiness.outputs.report-json }}
        run: |
          test "$SCORE" -ge 1
          test -s "$REPORT"
